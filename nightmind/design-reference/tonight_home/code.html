<script>
        // Micro-interaction: Tab switching simulation
        const tabs = document.querySelectorAll('nav button');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => {
                    t.classList.remove('text-primary', 'active-tab-underline');
                    t.classList.add('text-on-surface-variant');
                });
                tab.classList.remove('text-on-surface-variant');
                tab.classList.add('text-primary', 'active-tab-underline');
            });
        });

        // Subtle background flicker effect to simulate "Lucidity" atmosphere
        const cards = document.querySelectorAll('.glass-card');
        setInterval(() => {
            const randomCard = cards[Math.floor(Math.random() * cards.length)];
            randomCard.style.borderColor = '#ddb8ff33';
            setTimeout(() => {
                randomCard.style.borderColor = '#232833';
            }, 150);
        }, 4000);
    </script>
